<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1318">
<title>ATC trenažér Ruzyně</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: ATC console. Fixed top bar, test list on the left, live work area in the centre, checklist on the right. One dark theme by choice. */
:root {
  --bg: #0e1318;
  --panel: #151c24;
  --panel-2: #1c2530;
  --line: #2a3644;
  --text: #e7eef6;
  --dim: #93a4b7;
  --accent: #4fa3ff;
  --ok: #35c779;
  --bad: #ff5c57;
  --warn: #f6b73c;
  --font-ui: "Barlow", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-cond: "Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --nav-w: 208px;
  --checks-w: 290px;
  --top-h: 48px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 15px; line-height: 1.4;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  overflow: hidden; -webkit-text-size-adjust: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
input, textarea { -webkit-user-select: text; user-select: text; font-family: var(--font-ui); }
button { font-family: var(--font-ui); color: var(--text); }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { height: 100%; display: grid; grid-template-rows: var(--top-h) minmax(0, 1fr); grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--checks-w); }
#app.nav-hidden { grid-template-columns: 0 minmax(0, 1fr) var(--checks-w); }
#app.nav-hidden #testnav { visibility: hidden; }

/* Top bar */
#topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand b { font-family: var(--font-cond); font-weight: 600; font-size: 20px; letter-spacing: 0.04em; }
.brand span { color: var(--dim); font-size: 13px; }
.clock { font-family: var(--font-mono); font-size: 15px; color: var(--text); background: #0a0e12; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; border-right: 1px solid var(--line); min-width: 44px; height: 34px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 10px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #04121f; }
.tb-spacer { flex: 1; }
.tb-btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 12px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tb-btn.on { border-color: var(--ok); color: var(--ok); }
.tb-btn.warn { border-color: var(--warn); color: var(--warn); background: rgba(246,183,60,0.12); }
.tb-btn.primary { background: var(--accent); color: #04121f; border-color: var(--accent); }
.fps { font-family: var(--font-mono); font-size: 13px; color: var(--dim); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.icon-btn { width: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }

/* Test navigation */
#testnav { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 9px 10px; font-size: 15px; cursor: pointer; min-height: 42px; }
.nav-item:hover { background: var(--panel-2); }
.nav-item[aria-current="true"] { background: #213042; box-shadow: inset 3px 0 0 var(--accent); }
.nav-item .num { font-family: var(--font-mono); font-size: 12px; color: var(--dim); width: 18px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #3a4757; flex: none; margin-left: auto; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.part { background: var(--warn); }
.nav-sep { height: 1px; background: var(--line); margin: 6px 4px; }

/* Stage */
#stage { position: relative; overflow: hidden; background: #0b0f13; min-width: 0; }
.view { position: absolute; inset: 0; display: none; }
.view.active { display: block; }
.canvas-wrap { position: absolute; inset: 0; }
.canvas-wrap > canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.view-toolbar { position: absolute; left: 10px; top: 10px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 5; }
.vt-btn { background: rgba(10, 20, 32, 0.82); border: 1px solid rgba(160, 200, 240, 0.35); color: #e8f2fc; border-radius: 8px; height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.vt-btn.warn { border-color: var(--warn); color: var(--warn); }
.vt-btn[aria-pressed="true"] { background: var(--accent); color: #04121f; border-color: var(--accent); }

/* Right checklist */
#checks { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 12px; }
#checks h2 { font-family: var(--font-cond); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.howto { color: var(--dim); font-size: 14px; margin: 0; }
.howto b { color: var(--text); font-weight: 600; }
.auto { background: #0f161d; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; gap: 4px; }
.auto .k { color: var(--dim); }
.auto .row { display: flex; justify-content: space-between; gap: 8px; }
.auto .v { font-family: var(--font-mono); font-size: 12px; text-align: right; overflow-wrap: anywhere; }
.auto .v.ok { color: var(--ok); } .auto .v.bad { color: var(--bad); } .auto .v.warn { color: var(--warn); }
.check { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: var(--panel-2); }
.check.ok { border-color: rgba(53, 199, 121, 0.55); } .check.bad { border-color: rgba(255, 92, 87, 0.6); }
.check p { margin: 0; font-size: 14px; }
.check .detected { font-size: 12px; color: var(--ok); font-family: var(--font-mono); }
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.verdict button { height: 44px; border-radius: 8px; border: 1px solid var(--line); background: #121a22; font-weight: 600; font-size: 14px; cursor: pointer; }
.verdict button.yes[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #03140b; }
.verdict button.no[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #1c0303; }
.note { width: 100%; min-height: 64px; resize: vertical; background: #0f161d; border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 8px; font-size: 14px; }
.label-sm { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }

/* Command menu on radar */
.cmd-menu { position: absolute; z-index: 20; width: 384px; max-width: calc(100% - 16px); background: rgba(13, 25, 40, 0.96); border: 1px solid rgba(150, 195, 240, 0.55); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); color: #eaf3fc; padding: 10px; display: grid; gap: 8px; }
.cmd-head { display: flex; align-items: baseline; gap: 8px; }
.cmd-head b { font-family: var(--font-cond); font-size: 22px; letter-spacing: 0.03em; }
.cmd-head span { font-size: 13px; color: #a8c4e0; font-family: var(--font-mono); }
.cmd-head .x { margin-left: auto; background: transparent; border: 1px solid rgba(150,195,240,0.4); border-radius: 8px; width: 36px; height: 34px; font-size: 18px; cursor: pointer; }
.cmd-tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.cmd-tabs button { height: 38px; border-radius: 8px; border: 1px solid rgba(150,195,240,0.35); background: #10223a; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; cursor: pointer; padding: 0 2px; }
.cmd-tabs button[aria-pressed="true"] { background: #4fa3ff; color: #031426; border-color: #4fa3ff; }
.cmd-body { display: grid; gap: 6px; max-height: 380px; overflow-y: auto; overflow-x: hidden; min-width: 0; }
.cmd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.cmd-grid.cols3 { grid-template-columns: repeat(3, 1fr); }
.cmd-grid.cols2 { grid-template-columns: repeat(2, 1fr); }
.cmd-grid button, .cmd-wide { height: 44px; border-radius: 8px; border: 1px solid rgba(150,195,240,0.35); background: #142a45; font-family: var(--font-mono); font-size: 14px; cursor: pointer; color: #eaf3fc; }
.cmd-grid button.cur { border-color: #ffd36b; color: #ffd36b; }
.cmd-grid button.clr { background: #2a4f7a; border-color: #8ec5ff; }
.cmd-wide { width: 100%; font-family: var(--font-ui); font-weight: 600; }
.dial-wrap { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 8px; align-items: center; min-width: 0; }
.dial-wrap canvas { width: 172px; height: 172px; touch-action: none; }
.dial-side { display: grid; gap: 5px; min-width: 0; }
.dial-side button { min-width: 0; padding: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-grid > button { min-width: 0; }

/* Radio log */
.radio-log { position: absolute; right: 10px; bottom: 10px; width: calc(52% - 15px); max-width: 560px; max-height: 32%; overflow-y: auto; background: rgba(8, 16, 26, 0.84); border: 1px solid rgba(150,195,240,0.3); border-radius: 10px; padding: 8px 10px; font-size: 13px; z-index: 6; display: flex; flex-direction: column; gap: 3px; }
.radio-log .atc { color: #9fd1ff; }
.radio-log .plt { color: #eef6ff; }
.radio-log .sys { color: #ffd36b; }
.radio-log .t { font-family: var(--font-mono); color: #7f97b0; margin-right: 6px; font-size: 12px; }

/* Command line */
.cmdline { position: absolute; left: 10px; bottom: 10px; width: calc(48% - 15px); max-width: 480px; z-index: 7; display: grid; gap: 4px; }
.cmdline input { height: 42px; border-radius: 10px; border: 1px solid rgba(150,195,240,0.5); background: rgba(6, 14, 24, 0.92); color: #eaf3fc; font-family: var(--font-mono); font-size: 15px; padding: 0 12px; }
.cmdline .hint { font-size: 12px; color: #a8c4e0; background: rgba(6,14,24,0.8); border-radius: 6px; padding: 3px 8px; }

/* Panels used in tests */
.panel-page { position: absolute; inset: 0; overflow-y: auto; padding: 18px 20px 30px; display: grid; gap: 16px; align-content: start; }
.panel-page h3 { font-family: var(--font-cond); font-weight: 600; font-size: 20px; margin: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 14px; }
.kv .k { color: var(--dim); }
.kv .v { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }
.corner { position: fixed; width: 0; height: 0; z-index: 50; pointer-events: none; border-style: solid; }
.corner.tl { top: env(safe-area-inset-top); left: env(safe-area-inset-left); border-width: 22px 22px 0 0; border-color: var(--warn) transparent transparent transparent; }
.corner.tr { top: env(safe-area-inset-top); right: env(safe-area-inset-right); border-width: 0 22px 22px 0; border-color: transparent var(--warn) transparent transparent; }
.corner.bl { bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); border-width: 22px 0 0 22px; border-color: transparent transparent transparent var(--warn); }
.corner.br { bottom: env(safe-area-inset-bottom); right: env(safe-area-inset-right); border-width: 0 0 22px 22px; border-color: transparent transparent var(--warn) transparent; }
.corners-off .corner { display: none; }
.pad { position: relative; height: 320px; border: 1px dashed #3b4a5b; border-radius: 12px; background: #0f161d; touch-action: none; overflow: hidden; }
.pad > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pad .padhint { position: absolute; left: 12px; top: 10px; color: var(--dim); font-size: 13px; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--dim); background: #0f161d; }
.chip.on { border-color: var(--ok); color: var(--ok); background: rgba(53,199,121,0.08); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; min-height: 40px; padding: 0 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #04121f; }
.btn:disabled { opacity: 0.5; }
.voice-list { max-height: 220px; overflow-y: auto; font-family: var(--font-mono); font-size: 12px; color: var(--dim); display: grid; gap: 2px; }
.voice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.voice-grid button { text-align: left; min-height: 54px; padding: 6px 10px; display: grid; gap: 2px; }
.voice-grid button small { color: var(--dim); font-weight: 400; font-size: 12px; font-family: var(--font-mono); }
.range-row { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; align-items: center; font-size: 14px; }
.range-row output { font-family: var(--font-mono); font-size: 13px; text-align: right; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 30px; }
.dict-input { width: 100%; min-height: 64px; font-size: 18px; padding: 10px 12px; border-radius: 10px; border: 1px solid #3c5a7a; background: #0b131b; color: var(--text); resize: none; }
.parse-out { font-family: var(--font-mono); font-size: 13px; background: #0b131b; border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 64px; white-space: pre-wrap; }
.mini-radar { position: relative; height: 340px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.mini-radar > canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.result-pre { font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; background: #0b131b; border: 1px solid var(--line); border-radius: 10px; padding: 12px; -webkit-user-select: text; user-select: text; }
.keylog { font-family: var(--font-mono); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
.keylog span { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: #0f161d; }

/* Ground + window split */
.split-v { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 52fr) 12px minmax(0, 48fr); }
.split-v > div { position: relative; overflow: hidden; }
.split-bar { background: #050607; cursor: row-resize; touch-action: none; }
.split-bar::after { content: ''; position: absolute; left: 50%; top: 4px; width: 56px; height: 4px; margin-left: -28px; border-radius: 2px; background: #3f4c5c; }
.split-v > div > canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.window-ctrl { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; z-index: 5; flex-wrap: wrap; justify-content: flex-end; max-width: 70%; }
.window-ctrl .vis { display: flex; align-items: center; gap: 8px; background: rgba(10,20,32,0.82); border: 1px solid rgba(160,200,240,0.35); border-radius: 8px; padding: 0 10px; height: 38px; font-size: 13px; }
.window-ctrl .vis input { width: 120px; }

/* Strips */
.bay { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 6px; background: #2b2420; }
.bay-col { background: #3a3029; border: 1px solid #5a4a3e; border-radius: 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.bay-col h4 { margin: 0; padding: 8px 10px; font-family: var(--font-cond); font-weight: 600; font-size: 15px; letter-spacing: 0.05em; color: #f0dcc8; border-bottom: 1px solid #5a4a3e; }
.bay-list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
.strip { position: relative; display: grid; grid-template-columns: 7px minmax(0, 1fr); gap: 0 7px; min-height: 66px; border-radius: 6px; background: #efe3cf; color: #1c1a17; touch-action: none; cursor: grab; box-shadow: 0 1px 0 rgba(0,0,0,0.3); flex: none; }
.strip.arr { background: #f4dfa8; }
.strip .bar { border-radius: 6px 0 0 6px; background: #3f86d6; }
.strip.arr .bar { background: #d9902b; }
.strip .main { padding: 5px 7px 6px 0; display: grid; gap: 2px; min-width: 0; }
.strip .row1 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 6px; }
.strip .cs { font-family: var(--font-cond); font-weight: 600; font-size: 20px; letter-spacing: 0.02em; line-height: 1; }
.strip .sub { font-family: var(--font-mono); font-size: 11px; color: #4a4036; overflow-wrap: anywhere; }
.strip .flag { font-family: var(--font-cond); font-weight: 600; font-size: 13px; padding: 1px 6px; border-radius: 4px; background: #c9bba3; color: #2b241c; white-space: nowrap; }
.strip.clr .flag { background: #2f9e5b; color: #fff; }
.strip.dragging { opacity: 0.35; }
.strip-ghost { position: fixed; z-index: 1000; pointer-events: none; transform: rotate(-1.5deg); box-shadow: 0 10px 24px rgba(0,0,0,0.5); }
.strip-ph { height: 66px; border: 2px dashed #f0dcc8; border-radius: 6px; flex: none; }

/* Toast */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1f2b38; border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 2000; display: none; max-width: 80vw; }
#toast.show { display: block; }

@media (max-width: 1100px) {
  :root { --nav-w: 176px; --checks-w: 260px; }
}
@media (orientation: portrait) {
  #rotate-hint { display: flex; }
}
#rotate-hint { display: none; position: fixed; inset: auto 12px 12px 12px; z-index: 3000; background: var(--warn); color: #1d1300; border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* Instructor controls in the side panel (Czech), separate from the English system HMI */
.actions { display: grid; gap: 8px; margin: 2px 0 12px; }
.btn.warn-btn { border-color: var(--warn); color: var(--warn); }
.seg-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.seg-row button { height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; font-size: 14px; cursor: pointer; }
.seg-row button[aria-pressed="true"] { background: var(--accent); color: #04121f; border-color: var(--accent); }
.range-row.compact { grid-template-columns: 86px 1fr 58px; gap: 8px; }
.view-toolbar.br { left: auto; top: auto; right: 10px; bottom: 10px; }

/* Command input dock (test: Zadávání povelů) */
.canvas-wrap.with-dock { bottom: 214px; }
.radio-log.top { top: 60px; bottom: auto; max-height: 24%; width: calc(46% - 15px); }
.dock { position: absolute; left: 0; right: 0; bottom: 0; height: 214px; background: #0c141d; border-top: 1px solid #263445; padding: 8px 10px; display: grid; grid-template-rows: auto auto auto 1fr; gap: 6px; z-index: 8; }
.dock-cs, .dock-fix { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 38px; align-items: center; }
.dock-fix { background: #111c28; border-radius: 8px; padding: 0 4px; }
.cs-chip { flex: none; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(150,195,240,0.45); background: #142a45; font-family: var(--font-mono); font-size: 14px; color: #eaf3fc; cursor: pointer; }
.cs-chip.on { background: #4fa3ff; color: #031426; border-color: #4fa3ff; }
.cs-chip.pend { border-color: #ffd36b; color: #ffd36b; }
.cs-chip.on.pend { color: #031426; }
.dock-empty { font-family: var(--font-mono); font-size: 12px; color: var(--dim); }
.dock-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr); gap: 8px; align-items: center; }
.dock-line { height: 42px; border-radius: 10px; border: 1px solid rgba(150,195,240,0.55); background: #06101a; color: #eaf3fc; font-family: var(--font-mono); font-size: 17px; padding: 0 12px; min-width: 0; }
.dock-fb { font-family: var(--font-mono); font-size: 12px; color: #a8c4e0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

const D = window.LKPR;
const DEG = Math.PI / 180;
const KX = Math.cos(D.ref.lat * DEG) * 60; // NM per degree of longitude at reference latitude
const Geo = {
  toNM(lat, lon) { return { x: (lon - D.ref.lon) * KX, y: (lat - D.ref.lat) * 60 }; },
  toM(lat, lon) { const p = Geo.toNM(lat, lon); return { x: p.x * 1852, y: p.y * 1852 }; },
  fromNM(x, y) { return { lat: D.ref.lat + y / 60, lon: D.ref.lon + x / KX }; },
  dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); },
  brg(a, b) { return (Math.atan2(b.x - a.x, b.y - a.y) / DEG + 360) % 360; },
  norm360(a) { return ((a % 360) + 360) % 360; },
  diff(a, b) { let d = Geo.norm360(b - a); if (d > 180) d -= 360; return d; }, // signed shortest turn from a to b
  move(p, brg, d) { return { x: p.x + Math.sin(brg * DEG) * d, y: p.y + Math.cos(brg * DEG) * d }; },
};
const MAGVAR = D.magVar; // degrees east
const toMag = (t) => Geo.norm360(t - MAGVAR);
const toTrue = (m) => Geo.norm360(m + MAGVAR);

// Pre-projected fixes and navaids in NM
const FIX = {};
for (const [n, v] of Object.entries(D.fixes)) { const p = Geo.toNM(v[0], v[1]); FIX[n] = { n, x: p.x, y: p.y, cls: v[2] }; }
for (const [n, v] of Object.entries(D.navaids)) { const p = Geo.toNM(v[0], v[1]); FIX[n] = { n, x: p.x, y: p.y, cls: v[2] === 'NDB' ? 'ndb' : 'vor', freq: v[3], name: v[4] }; }
const RWY = {};
for (const r of D.rwys) {
  const t = Geo.toNM(r.thr[0], r.thr[1]); const e = Geo.toNM(r.end[0], r.end[1]);
  RWY[r.id] = { ...r, x: t.x, y: t.y, ex: e.x, ey: e.y, crs: r.trueHdg };
}

  digits(n, len) { let s = String(Math.round(Math.abs(n))); if (len) s = s.padStart(len, '0'); return s.split('').map(c => DIGW[+c]).join(' '); },
  suffix(s) { // flight id like 35J -> "three five Juliett"

  thousands(ft) { // 4000 -> "four thousand", 3500 -> "three thousand five hundred"

    return s;
  },
  level(alt) { return alt >= D.ta + 500 ? `flight level ${Speak.digits(alt / 100)}` : `altitude ${Speak.thousands(alt)} feet`; },
  freq(f) { const [a, b] = f.split('.'); return `${Speak.digits(+a)} decimal ${b.split('').map(c => DIGW[+c]).join(' ')}`; },
  fix(n) { // VORs by name as pilots say them (OKL spelled phonetically), five-letter points as words

    return n.length <= 3 ? n.split('').map(c => PHON[c.charCodeAt(0) - 65] || c).join(' ') : n[0] + n.slice(1).toLowerCase(); },
};

'use strict';
/* Air situation simulation for the APP position: flight model, navigation, ILS, separation monitoring. */

class Aircraft {
  constructor(o) {
    Object.assign(this, {
      cs: o.cs, type: o.type, kind: o.kind || 'arr', orig: o.orig || '', dest: o.dest || '', sq: o.sq || String(1000 + Math.floor(Math.random() * 6777)).replace(/[89]/g, '7'),
      x: o.x, y: o.y, alt: o.alt, hdg: o.hdg ?? 0, ias: o.ias ?? 250, vs: 0, tas: 0, gs: 0, trk: o.hdg ?? 0,
      tgtAlt: o.cfl ?? o.alt, tgtIas: null, tgtHdg: null, turnDir: 0,
      route: (o.route || []).slice(), routeIdx: 0, mode: (o.route && o.route.length) ? 'route' : 'hdg',
      ils: null, locCap: false, gsCap: false, ctl: o.ctl || 'own', star: o.star || '', sid: o.sid || '', rfl: o.rfl || null,
      labelOff: o.labelOff || { dx: 34, dy: -34 }, hist: [], disp: null, stca: false, done: null, lastCmd: '', created: 0,
      xfl: o.xfl || null, spoke: false,
    });
    this.perf = PERF[this.type] || PERF.A320;
    this.wtc = this.perf.wtc;
    if (this.tgtHdg === null) this.tgtHdg = this.hdg;
    this.snapshot();
  }
  get airline() { return AIRLINES[this.cs.slice(0, 3)]; }
  get nextFix() { return this.mode === 'route' ? this.route[this.routeIdx] : null; }
  snapshot() {
    this.disp = { x: this.x, y: this.y, alt: this.alt, gs: this.gs || this.ias, trk: this.trk, vs: this.vs, hdg: this.hdg };
    this.hist.unshift({ x: this.x, y: this.y }); if (this.hist.length > 7) this.hist.pop();
  }
  defaultIas() {
    const p = this.perf, max = p.maxIas || 999;
    let v;
    if (this.kind === 'dep') v = this.alt < 3000 + 1200 ? p.v2 + 25 : (this.alt < 10000 ? 250 : 290);
    else {
      v = this.alt > 10500 ? 280 : 250;
      if (this.ils && this.locCap) {
        const s = this.locGeom(this.ils).s;
        v = s > 12 ? Math.min(v, 200) : s > 7 ? 180 : s > 4.5 ? 160 : p.vapp;

    return Math.min(v, max);
  }
  distTo(x, y) { return Math.hypot(this.x - x, this.y - y); }
  locGeom(rwyId) {
    const R = RWY[rwyId]; const ux = Math.sin(R.crs * DEG), uy = Math.cos(R.crs * DEG);
    const dx = this.x - R.x, dy = this.y - R.y;

    const tas = Math.max(this.tas, 80);
    return Geo.norm360(track - Math.asin(clamp(cw / tas, -0.5, 0.5)) / DEG);

'use strict';

const Phrase = {
  // What the controller says (log text, digits for readability)
  atc(ac, c, sim) {
    const cs = Phrase.csText(ac);

      case 'hdg': { const dir = c.dir < 0 ? 'turn left ' : c.dir > 0 ? 'turn right ' : ''; return `${cs}, ${dir}heading ${String(c.val).padStart(3, '0')}`; }
      case 'alt': { const v = c.val > ac.alt + 50 ? 'climb' : c.val < ac.alt - 50 ? 'descend' : 'maintain';
        return c.val >= D.ta + 500 ? `${cs}, ${v} flight level ${Math.round(c.val / 100)}` : `${cs}, ${v} altitude ${c.val} feet, QNH ${sim.qnh}`; }
      case 'spd': return c.val === null ? `${cs}, no ATC speed restrictions` : `${cs}, ${c.val < ac.ias - 3 ? 'reduce' : c.val > ac.ias + 3 ? 'increase' : 'maintain'} speed ${c.val} knots`;
      case 'dct': return `${cs}, proceed direct ${c.fix}`;
      case 'ils': return `${cs}, cleared ILS approach runway ${c.rwy}`;
      case 'xfer': return c.to === 'TWR' ? `${cs}, contact Ruzyně Tower ${D.freq.TWR}` : `${cs}, contact Praha Control, good day`;
      case 'res': return `${cs}, resume own navigation`;
      case 'assume': return `${cs}, Praha Radar, radar contact`;
    }
    return cs;
  },
  csText(ac) { const al = AIRLINES[ac.cs.slice(0, 3)]; return al ? `${al.tel[0]}${al.tel.slice(1).toLowerCase()} ${ac.cs.slice(3)}` : ac.cs; },

  // and every variant uses only words the voice packs contain. Returns display text and spoken text.
  readback(ac, cmds, sim) {
    const parts = [], spoken = []; const h = Sound.hash(ac.cs); const pick = (n) => (h + (Math.random() < 0.3 ? 1 : 0)) % n;
    const fl = (v) => `FL${Math.round(v / 100)}`;
    for (const c of cmds) {
      switch (c.type) {
        case 'hdg': {
          const d = c.dir < 0 ? 'left ' : c.dir > 0 ? 'right ' : ''; const hd = String(c.val).padStart(3, '0'); const sp = Speak.digits(c.val, 3);
          if (d && pick(2)) { parts.push(`turning ${d}heading ${hd}`); spoken.push(`turning ${d}heading ${sp}`); } else { parts.push(`${d}heading ${hd}`); spoken.push(`${d}heading ${sp}`); }

          const v = verbs[pick(3)];

          else { parts.push(`${v} ${c.val} ft, QNH ${sim.qnh}`); spoken.push(`${v} ${Speak.level(c.val)}, Q N H ${Speak.digits(sim.qnh, 4)}`); }
          break; }
        case 'spd': {

          const dir = c.val < ac.ias - 3 ? -1 : c.val > ac.ias + 3 ? 1 : 0; const sp = Speak.digits(c.val);

          const f = forms[pick(3)]; parts.push(`${f[0]} ${c.val} kt`); spoken.push(`${f[1]} ${sp} knots`); break; }
        case 'dct': if (pick(2)) { parts.push(`proceeding direct ${c.fix}`); spoken.push(`proceeding direct ${Speak.fix(c.fix)}`); } else { parts.push(`direct ${c.fix}`); spoken.push(`direct ${Speak.fix(c.fix)}`); } break;
        case 'ils': if (pick(2)) { parts.push(`cleared ILS ${c.rwy}`); spoken.push(`cleared I L S runway ${Speak.digits(+c.rwy, 2)}`); } else { parts.push(`cleared ILS approach ${c.rwy}`); spoken.push(`cleared I L S approach runway ${Speak.digits(+c.rwy, 2)}`); } break;
        case 'xfer':
          if (c.to === 'TWR') { if (pick(2)) { parts.push(`${D.freq.TWR}, good day`); spoken.push(`${Speak.freq(D.freq.TWR)}, good day`); } else { parts.push(`Tower ${D.freq.TWR}, bye`); spoken.push(`Tower ${Speak.freq(D.freq.TWR)}, bye bye`); } }

        case 'assume': parts.push('roger'); spoken.push('roger'); break;
      }
    }
    return { text: `${parts.join(', ')}, ${Phrase.csText(ac)}`, say: `${spoken.join(', ')}, ${Speak.callsign(ac)}` };

/* ---------- Command menu (touch-first) ---------- */
class CommandMenu {
  constructor(view) {
    this.view = view; this.tab = 'hdg'; this.turn = 0;
    this.root = el('div', { class: 'cmd-menu', role: 'dialog', 'aria-label': 'Command menu', style: 'display:none' });

  }
  open(ac, sx, sy) { this.ac = ac; this.anchor = { sx, sy }; this.root.style.display = 'grid'; this.render(); App.feature('menuOpen'); }

    const W = this.view.W, H = this.view.H, mw = this.root.offsetWidth || 336, mh = this.root.offsetHeight || 420;
    let x = sx + 40 + mw > W ? sx - 40 - mw : sx + 40; let y = sy - mh / 2;

  }

    const ac = this.ac; if (!ac) return;
    const r = this.root; r.innerHTML = '';
    const cur = `${fmtAlt(ac.alt)} ${String(Math.round(toMag(ac.hdg))).padStart(3, '0')}° ${Math.round(ac.ias)}KT`;
    r.append(el('div', { class: 'cmd-head' }, el('b', { text: ac.cs }), el('span', { text: `${ac.type}/${ac.wtc} · ${cur}` }), el('button', { class: 'x', 'aria-label': 'Close', onclick: () => this.view.select(null) }, '×')));
    if (ac.ctl === 'pend') r.append(el('button', { class: 'cmd-wide', style: 'background:#5a4a12;border-color:#ffd36b;color:#ffe4a0', onclick: () => this.issue({ type: 'assume' }) }, 'ASSUME'));
    const tabs = [['hdg', 'HDG'], ['alt', 'CFL'], ['spd', 'SPD'], ['dct', 'DCT'], ['app', 'APP'], ['xfer', 'XFER']];
    const tb = el('div', { class: 'cmd-tabs', role: 'tablist' });
    for (const [k, t] of tabs) tb.append(el('button', { 'aria-pressed': String(this.tab === k), onclick: () => { this.tab = k; this.render(); } }, t));
    r.append(tb);
    const body = el('div', { class: 'cmd-body' }); r.append(body);
    if (this.tab === 'hdg') this.hdgBody(body, ac);
    else if (this.tab === 'alt') {
      const g = el('div', { class: 'cmd-grid' });
      const lv = [3000, 3500, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 11000, 12000, 13000, 14000, 15000, 16000, 17000, 19000, 21000, 23000, 24000];
      for (const v of lv) { const b = el('button', { onclick: () => this.issue({ type: 'alt', val: v }) }, v >= D.ta + 500 ? 'FL' + String(v / 100).padStart(3, '0') : 'A' + String(v / 100).padStart(3, '0')); if (v === ac.tgtAlt) b.classList.add('clr'); if (Math.abs(v - ac.alt) < 500) b.classList.add('cur'); g.append(b); }
      body.append(g);
    } else if (this.tab === 'spd') {
      const g = el('div', { class: 'cmd-grid' });
      for (const v of [160, 170, 180, 190, 200, 210, 220, 230, 240, 250, 260, 280]) { const b = el('button', { onclick: () => this.issue({ type: 'spd', val: v }) }, String(v)); if (v === ac.tgtIas) b.classList.add('clr'); g.append(b); }
      body.append(g, el('button', { class: 'cmd-wide', onclick: () => this.issue({ type: 'spd', val: null }) }, 'SPEED: NO RESTRICTION'));
    } else if (this.tab === 'dct') {
      const list = Object.values(FIX).filter(f => f.cls !== 'ndb').map(f => ({ f, d: Math.hypot(f.x - ac.x, f.y - ac.y) })).filter(o => o.d < 70).sort((a, b) => a.d - b.d).slice(0, 16);

    [[-20, 'L20'], [20, 'R20'], [-10, 'L10'], [10, 'R10']].forEach(([dv, t]) => q.append(el('button', { onclick: () => this.issue({ type: 'hdg', val: (Geo.norm360(curMag + dv) || 360), dir: Math.sign(dv) }) }, t)));
    side.append(q, el('button', { class: 'cmd-wide', onclick: () => this.issue({ type: 'hdg', val: Math.round(toMag(ac.hdg)) || 360, dir: 0 }) }, 'PRESENT HDG'));

const GM = (lat, lon) => Geo.toM(lat, lon); // metres east/north of ARP
const RW24 = RWY['24'], RW06 = RWY['06'];

const GROUND_PATHS = {
  depTaxi: pathFrom([[50.10707, 14.26319], [50.10775, 14.26394]]),
  depTaxi2: pathFrom([[50.10775, 14.26394], [50.10806, 14.26326], [50.10822, 14.26275], [50.11068, 14.26536], [50.11289, 14.27281], [50.11391, 14.27623], [50.11444, 14.27651], [50.11503, 14.27606], [50.11522, 14.27556]]),
  lineUp: pathFrom([[50.11522, 14.27556], [50.11550, 14.27482], [50.11555, 14.27300]]),
  arrTaxi: pathFrom([[50.10810, 14.24721], [50.10816, 14.25056], [50.10795, 14.25196], [50.10592, 14.25773], [50.10519, 14.25938], [50.10470, 14.26146], [50.10416, 14.26151]]),

      { cs: 'EZS98KH', type: 'A320', kind: 'arr', stand: '7', phase: 'final', d: -5600, spd: 70, size: 36, alt: 300, info: 'LSGG-LKPR · RWY 24' },

    ta.addEventListener('input', () => this.setNote(t.id, ta.value)); ta.addEventListener('keydown', e => e.stopPropagation());
    box.append(el('label', { class: 'label-sm', for: id, text: 'Poznámka' }), ta);
    const idx = TESTS.indexOf(t); const next = TESTS[idx + 1];
    if (next) box.append(el('button', { class: 'btn primary', onclick: () => this.show(next.id) }, `Další test: ${next.name}`));
  }
};
App.fillAuto = function (t) {
  const rows = t.auto ? t.auto() : []; this.autoBox.innerHTML = '';
  if (!rows.length) { this.autoBox.append(el('div', { class: 'k', text: 'Nic se neměří.' })); return; }
  for (const [k, v, cls] of rows) this.autoBox.append(el('div', { class: 'row' }, el('span', { class: 'k', text: k }), el('span', { class: 'v ' + (cls || ''), text: v })));
};
App.show = function (id) {
  const t = TESTS.find(x => x.id === id); if (!t) return;
  if (this.activeTest && this.activeTest.hide) this.activeTest.hide();
  for (const v of this.stage.querySelectorAll('.view')) v.classList.remove('active');
  let v = this.mounted[id];
  if (!v) { v = el('section', { class: 'view', 'aria-label': t.name }); this.stage.append(v); this.mounted[id] = v; v.classList.add('active'); try { t.mount(v); } catch (e) { console.error(e); v.append(el('p', { style: 'padding:20px;color:#ff5c57', text: 'Chyba při spuštění testu: ' + e.message })); } }
  v.classList.add('active');
  this.active = id; this.activeTest = t; Store.set('atc.demo.active', id); this.checksEl.scrollTop = 0;
  if (t.show) t.show();
  this.renderNav(); this.renderChecks();
  setTimeout(() => this.radars.forEach(r => r.resize()), 30);
};
App.resultText = function () {
  const ipad = /iPad/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  const L = ['ATC Ruzyně · test funkcí v0.3 · výsledky', `Datum: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
    `Zařízení: ${ipad ? 'iPad' : navigator.platform}, okno ${innerWidth}×${innerHeight}, DPR ${devicePixelRatio}, dotykové body ${navigator.maxTouchPoints || 0}`,
    `Vstupy: dotyk ${this.inputs.touch}, pero ${this.inputs.pen} (hover ${this.inputs.penHover}, max. přítlak ${this.inputs.maxPressure.toFixed(2)}), myš ${this.inputs.mouse} (hover ${this.inputs.mouseHover}), klávesy ${this.keys.length}`,
    `Zvuk: syntéza ${Sound.ttsOk ? 'ano' : 'ne'}, hlasů ${Sound.voices.length}, jazyky ${[...new Set(Sound.voices.map(v => v.lang))].join(' ') || '–'}, přehráno ${Sound.ttsEvents.end}, chyb ${Sound.ttsEvents.error}`,
    `Zvukový systém: stav ${Sound.status()}, kontext ${Sound.ctx ? Sound.ctx.state : '–'}, audioSession ${Sound.diag.session}, médium ${Sound.diag.media}, odemknutí ${Sound.diag.unlocks}, obnovení ${Sound.diag.resumes} (selhalo ${Sound.diag.resumeFails}), zahozené zvuky ${Sound.diag.dropped}`,
    `Hlasové balíčky: načteno ${VoicePack.stats.loaded.join(' ') || '–'}, relací z balíčků ${VoicePack.stats.pack}, hlasem zařízení ${VoicePack.stats.device}, chybějící slova ${Object.keys(VoicePack.stats.missing).join(' ') || '–'}${VoicePack.stats.loadErr ? ', chyby načtení ' + VoicePack.stats.lastErr : ''} · výkon: ${this.perfResult ? `${this.perfResult.avg.toFixed(0)} fps průměr, ${this.perfResult.min.toFixed(0)} fps minimum, ${this.perfResult.n} letadel` : 'neměřeno'}`,
    `Úložiště: localStorage ${Store.ok ? 'ano' : 'ne'}, IndexedDB ${this.idbStatus || '–'}, spuštění ${this.launches}, přechody na pozadí ${this.hiddenCount}`, ''];
  TESTS.forEach((t, i) => {
    if (t.summary) return; const r = this.results[t.id] || {};
    L.push(`[${i + 1}] ${t.name}`);
    for (const c of t.checks) { const v = r[c.id]; const a = c.auto ? c.auto() : null; L.push(`  ${v === 'ok' ? 'FUNGUJE  ' : v === 'bad' ? 'NEFUNGUJE' : '–        '} ${c.t}${a ? ' (zachyceno automaticky)' : ''}`); }
    if (r._note) L.push(`  Poznámka: ${r._note}`);
  });
  return L.join('\n');
};

/* ---------- demo world ---------- */
function setupWorld() {
  App.sim = new Sim({ sweep: 4 }); App.comms = new Comms(App.sim); App.gt = new GroundTraffic();
  demoTraffic(App.sim);
  const sim = App.sim, comms = App.comms;
  const klm = sim.find('KLM1355'); if (klm) comms.pilot(klm, 'Praha Radar, KLM 1355, descending FL130, inbound GOLOP', `Praha Radar, ${Speak.callsign(klm)}, descending flight level one three zero, inbound Golop`, 6);
  sim.on('stca', (list) => { Sound.tone('stca'); App.feature('stca'); comms.log('sys', `STCA ${list.map(a => a.cs).join(' / ')}`); if (Sound.status() === 'paused') toast('Výstraha STCA: zvuk je pozastavený, klepni kamkoli pro obnovení.', 3000); });
  sim.on('loc', (ac) => { if (ac.ctl === 'own') comms.pilot(ac, `established localizer runway ${ac.ils}, ${Phrase.csText(ac)}`, `established localizer runway ${Speak.digits(+ac.ils, 2)}, ${Speak.callsign(ac)}`, rnd(1, 3)); });
  sim.on('landed', (ac) => comms.log('sys', `${ac.cs} LANDED RWY ${ac.ils || ''}${ac.ctl !== 'xfer' ? ' (NOT TRANSFERRED TO TWR)' : ''}`));
  sim.on('goaround', (ac, why) => { comms.log('sys', `${ac.cs} MISSED APPROACH`); comms.pilot(ac, `going around, ${Phrase.csText(ac)}`, `going around, ${Speak.callsign(ac)}`, 1); });
  sim.on('left', (ac) => comms.log('sys', `${ac.cs} LEFT AREA`));
  App.gt.onEvent = (t) => { if (App.active === 'ground') toast(t, 2000); };
  // keep the demo alive: new arrivals every 100 s and departures every 150 s of simulated time
  App.spawnT = sim.t + 100; App.depT = sim.t + 70;
}
function maintainWorld() {
  const sim = App.sim;
  if (sim.t >= App.depT) {
    App.depT = sim.t + 150;
    if (sim.ac.filter(a => a.kind === 'dep').length < 4) {
      const al = pick(['EZY', 'TVS', 'RYR', 'WZZ', 'DLH', 'KLM', 'AFR']); const cs = al + Math.floor(rnd(10, 99)) + pick(['ZR', 'K', 'A', 'TX', 'P']);
      const exit = pick(['BALTU', 'VOZ', 'VENOX', 'DOBEN']);
      const a = spawnDeparture(sim, cs, pick(['A21N', 'A320', 'B38M', 'E190']), exit, 350); VoicePack.preload([cs]);
      App.comms.pilot(a, `Praha Radar, ${Phrase.csText(a)}, passing 1700 feet climbing 5000 feet, ${exit} departure`, `Praha Radar, ${Speak.callsign(a)}, passing one thousand seven hundred feet, climbing five thousand feet, ${Speak.fix(exit)} departure`, 2);
    }
  }
  if (sim.t < App.spawnT) return; App.spawnT = sim.t + 100;
  if (sim.ac.length > 12) return;
  const entries = [['GOLOP', 'ERASU', ['ERASU']], ['LOMKI', 'SOMIS', ['SOMIS', 'EVEMI', 'ERASU']], ['APRAQ', 'ARVEG', ['ARVEG', 'RATEV']], ['VLM', 'ARVEG', ['ARVEG', 'RATEV']]];
  const [a, b, route] = pick(entries); const p = placeOnLeg(a, b, -2);
  const al = pick(['TVS', 'RYR', 'EZY', 'WZZ', 'DLH', 'AFR', 'KLM', 'BAW', 'LOT', 'AUA', 'SWR', 'THY']);
  const cs = al + (Math.floor(rnd(100, 999))) + (Math.random() < 0.5 ? pick(['A', 'B', 'C', 'K', 'M']) : '');
  VoicePack.preload([cs]);
  sim.add({ cs, type: pick(['A320', 'B38M', 'A21N', 'E190', 'B738', 'A20N']), kind: 'arr', ...p, alt: 15000, cfl: 11000, ias: 280, route, orig: pick(['EGLL', 'EDDF', 'LFPG', 'LIRF', 'EHAM', 'LEMD', 'EPWA', 'LOWW']), dest: 'LKPR', star: a, ctl: 'pend', labelOff: { dx: 34, dy: -34 } });
  App.comms.pilot(sim.find(cs), `Praha Radar, ${Phrase.csText(sim.find(cs))}, FL150 descending FL110, inbound ${a}`, `Praha Radar, ${Speak.callsign(sim.find(cs))}, flight level one five zero, descending flight level one one zero, inbound ${Speak.fix(a)}`, 8);
}

/* ---------- main loop ---------- */
let lastT = performance.now(), fpsAcc = 0, fpsN = 0, fpsT = performance.now();
function frame(now) {
  const dt = Math.min(0.25, (now - lastT) / 1000); lastT = now;
  fpsN++; if (now - fpsT > 1000) { App.fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; App.fpsEl.textContent = App.fps.toFixed(0) + ' fps'; }
  if (!App.paused) {
    let left = dt * App.speed; while (left > 1e-6) { const s = Math.min(0.1, left); App.sim.step(s); App.gt.step(s); left -= s; }
    maintainWorld();
  }
  App.comms.tick();
  App.clockEl.textContent = hhmmss(App.sim.t) + ' UTC';
  const t = App.activeTest;
  if (t) { try { if (t.tick) t.tick(dt * App.speed); if (t.draw) t.draw(now); } catch (e) { if (!App._drawErr) { App._drawErr = true; console.error(e); toast('Chyba vykreslování: ' + e.message, 6000); } } }
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function boot() {
  App.results = Store.get('atc.demo.results', {}) || {};
  const savedIn = Store.get('atc.demo.inputs', null); if (savedIn && typeof savedIn === 'object') for (const k of Object.keys(App.inputs)) if (savedIn[k] !== undefined) App.inputs[k] = savedIn[k];
  App.launches = (Store.get('atc.launches', 0) || 0) + 1; Store.set('atc.launches', App.launches);
  try {
    const req = indexedDB.open('atc-demo', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => { try { const tx = req.result.transaction('kv', 'readwrite'); tx.objectStore('kv').put(Date.now(), 'last'); tx.oncomplete = () => { App.idbStatus = 'ok'; App.refreshChecks(); }; tx.onerror = () => { App.idbStatus = 'chyba'; }; } catch (e) { App.idbStatus = 'chyba'; } };
    req.onerror = () => { App.idbStatus = 'nedostupná'; };
  } catch (e) { App.idbStatus = 'nedostupná'; }
  buildShell(); setupWorld(); Sound.init(); setSpeed(1);
  // Audio may only start inside a user gesture. Keep trying on every gesture until the context really runs (iOS suspends it after backgrounding).
  const unlockHook = () => { if (!Sound.live()) Sound.unlock(); };
  for (const ev of ['touchend', 'click', 'keydown', 'pointerup']) window.addEventListener(ev, unlockHook, true);
  window.addEventListener('pagehide', () => Sound.onHidden());
  window.addEventListener('pageshow', () => Sound.onVisible());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { App.hiddenCount++; if (!App.paused) { setSpeed(0); App.autoPaused = true; } Sound.onHidden(); return; }
    Sound.onVisible();
    if (App.autoPaused) { App.autoPaused = false; toast('Simulace se pozastavila, když byla aplikace na pozadí. Pokračuj tlačítkem 1×. Zvuk se obnoví prvním klepnutím.', 4200); App.refreshChecks(); }
  });
  window.addEventListener('keydown', (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    App.keySeen(e);
    if (e.key === ' ') { e.preventDefault(); setSpeed(0); return; }
    if (e.key === 'Escape') { App.radars.forEach(r => r.select(null)); return; }
    if (e.key.length === 1 && /[a-z0-9]/i.test(e.key) && !e.metaKey && !e.ctrlKey) {
      const inp = App.cmdInputs.find(i => i.offsetParent !== null);
      if (inp) { e.preventDefault(); inp.focus(); inp.value += e.key.toUpperCase(); inp.dispatchEvent(new Event('input')); App.feature('autoFocus'); }
    }
  });
  window.addEventListener('resize', () => App.radars.forEach(r => r.resize()));
  const start = Store.get('atc.demo.active', 'radar');
  App.show(TESTS.some(t => t.id === start) ? start : 'radar');
  requestAnimationFrame(frame);
}
window.addEventListener('DOMContentLoaded', boot);
window.addEventListener('error', (e) => { try { toast('Chyba: ' + e.message, 6000); } catch (_) {} });

</script>
